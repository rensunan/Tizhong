<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0ea472" />
  <title>见轻 · 体重管理</title>
  <link rel="stylesheet" href="styles.css?v=20261110r" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">见轻</div>
    <div class="boot-spin"></div>
    <div class="boot-text">正在连接云端…</div>
  </div>

  <section id="view-auth" class="view hidden"></section>
  <section id="view-onboard" class="view hidden"></section>

  <section id="view-main" class="view hidden">
    <header id="topbar" class="topbar"></header>
    <div id="guestbar" class="guestbar hidden"></div>
    <main id="page" class="page"></main>
    <nav id="tabbar" class="tabbar">
      <button class="tab" data-view="today">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.8V20a1 1 0 0 0 1 1h4.5v-5.5h3V21H18a1 1 0 0 0 1-1V9.8"/></svg></span><em>今日</em></button>
      <button class="tab" data-view="exlib">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="3.4" width="7.2" height="7.2" rx="2"/><rect x="13.4" y="3.4" width="7.2" height="7.2" rx="2"/><rect x="3.4" y="13.4" width="7.2" height="7.2" rx="2"/><rect x="13.4" y="13.4" width="7.2" height="7.2" rx="2"/></svg></span><em>动作</em></button>
      <button class="tab" data-view="trend">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 14.5l4-4 3 2.5 5.5-6"/><path d="M14.5 7H17.5v3"/></svg></span><em>趋势</em></button>
      <button class="tab" data-view="plan">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4" width="15" height="17" rx="2.5"/><path d="M9 4V2.8h6V4"/><path d="M8.5 10.5h7M8.5 14h7M8.5 17.5h4.5"/></svg></span><em>方案</em></button>
      <button class="tab" data-view="me">
        <span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.6-3.8 4.4-5.5 7.5-5.5s5.9 1.7 7.5 5.5"/></svg></span><em>我的</em></button>
    </nav>
  </section>

  <div id="sheet-root"></div>
  <div id="picker-root"></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="config.js?v=20261110r"></script>
  <script src="data-exercises.js?v=20261110r"></script>
  <script src="ex-media.js?v=20261110r"></script>
  <script src="ex-cdn.js?v=20261110r"></script>
  <script src="ex-desc.js?v=20261110r"></script>
  <script src="data-foods.js?v=20261110r"></script>
  <script src="engine.js?v=20261110r"></script>
  <script src="charts.js?v=20261110r"></script>
  <script src="picker.js?v=20261110r"></script>
  <script src="store.js?v=20261110r"></script>
  <script src="app.js?v=20261110r"></script>
</body>
</html>
